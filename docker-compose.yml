services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - story_uploads:/app/upload
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/darori
      SPRING_DATASOURCE_USERNAME: ${DB_USER:?Set DB_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      SPRING_JPA_SHOW_SQL: "false"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_EC2_METADATA_V1_DISABLED: "true"
      DARORI_NEWSLETTER_FROM: ${DARORI_NEWSLETTER_FROM:-}
      DARORI_NEWSLETTER_SES_TEST_RECIPIENT: ${DARORI_NEWSLETTER_SES_TEST_RECIPIENT:-}
      DARORI_STORY_IMAGES_S3_BUCKET: ${DARORI_STORY_IMAGES_S3_BUCKET:-}
      DARORI_STORY_IMAGES_S3_REGION: ${DARORI_STORY_IMAGES_S3_REGION:-}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: darori
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-dev-admin@example.test}
      BOOTSTRAP_ADMIN_PASSWORD_HASH: ${BOOTSTRAP_ADMIN_PASSWORD_HASH:-}
    volumes:
      - postgres18_data:/var/lib/postgresql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./deploy/postgres/02-bootstrap-admin.sh:/docker-entrypoint-initdb.d/02-bootstrap-admin.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  postgres18_data:
  story_uploads:
