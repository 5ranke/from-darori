spring:
  config:
    import: "optional:file:.env[.properties]"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:postgresql://localhost:5432/darori_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: from-darori
    access-token-ttl: 30m
    refresh-token-ttl: 7d
    remember-me-refresh-token-ttl: 30d
    cookie-secure: ${JWT_COOKIE_SECURE:true}

darori:
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.4}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
