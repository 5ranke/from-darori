spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/darori_db
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

security:
  jwt:
    secret: ${JWT_SECRET}
    issuer: from-darori
    access-token-ttl: 30m
    refresh-token-ttl: 7d
    remember-me-refresh-token-ttl: 30d
    cookie-secure: ${JWT_COOKIE_SECURE:true}
