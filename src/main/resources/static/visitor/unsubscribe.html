<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>구독 해지 | From. 다로리</title>
  <link rel="icon" type="image/svg+xml" href="../images/visitor/darori-envelope-logo.svg">
  <link rel="stylesheet" href="../css/site-header.css">
  <link rel="stylesheet" href="../css/visitor/visitor-common.css">
  <link rel="stylesheet" href="../css/visitor/visitor-unsubscribe.css">
  <script defer src="../js/visitor/visitor-common.js"></script>
  <script defer src="../js/visitor/visitor-unsubscribe.js"></script>
</head>
<body class="visitor-page" data-visitor-page="unsubscribe">
  <div data-visitor-header></div>

  <main class="visitor-container vu-main">
    <!-- ===== 작성 화면 ===== -->
    <section id="vu-form-section">
      <h1 class="vu-title">구독 해지</h1>
      <p class="vu-desc">다로리 뉴스레터 구독을 해지하려면 구독하신 이메일을 입력해 주세요.<br>아쉽지만 언제든 다시 구독하실 수 있어요.</p>

      <form class="vu-card" id="vu-form" novalidate>
        <label class="vu-label" for="vu-email-input">이메일</label>
        <input id="vu-email-input" class="vu-input" type="email" maxlength="254" placeholder="이메일을 입력하세요." autocomplete="email">

        <label class="vu-label" for="vu-reason">해지 사유</label>
        <select id="vu-reason" class="vu-input vu-select">
          <option value="">선택해 주세요</option>
          <option value="CONTENT_MISMATCH">내용이 관심사와 달라요.</option>
          <option value="NO_LONGER_INTERESTED">이제 마을 소식이 궁금하지 않아요.</option>
          <option value="NOT_RECOGNIZED">구독한 기억이 없어요.</option>
          <option value="OTHER">기타</option>
        </select>

        <label class="vu-label" for="vu-detail">내용 (선택)</label>
        <textarea id="vu-detail" class="vu-input vu-textarea" maxlength="1000" placeholder="내용을 입력하세요."></textarea>

        <p class="vu-error" id="vu-error" role="alert" hidden></p>
        <button type="submit" class="vu-submit" id="vu-submit" disabled>해지하기</button>
      </form>
    </section>

    <!-- ===== 해지 완료 화면 ===== -->
    <section class="vu-done" id="vu-done" hidden>
      <div class="vu-done-icon" aria-hidden="true">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.5l4.5 4.5L19 7.5"/>
        </svg>
      </div>
      <h1 class="vu-done-title" id="vu-done-title" tabindex="-1">구독 해지가 접수되었어요</h1>
      <p class="vu-desc">그동안 다로리 편지를 읽어 주셔서 고마웠어요.<br>마음이 바뀌시면 언제든 다시 구독해 주세요.</p>
      <!-- 홈 경로가 정해지면 href 바꾸기 -->
      <a class="vu-home" href="/">홈으로 돌아가기</a>
    </section>
  </main>

  <div data-visitor-footer></div>
</body>
</html>
