<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>다로리 편지 | From. 다로리</title>
  <link rel="stylesheet" href="../css/visitor/visitor-common.css">
  <link rel="stylesheet" href="../css/visitor/visitor-letter.css">
  <script>
    window.DaroriVisitorConfig = { page: 'home', routes: { home: '../index.html', subscribe: '../index.html#subscription' } };
  </script>
  <script defer src="../js/visitor/visitor-common.js"></script>
  <script defer src="../js/visitor/visitor-letter.js"></script>
</head>
<body class="visitor-page visitor-letter-page" data-visitor-page="home">
  <div data-visitor-header></div>
  <main class="visitor-letter-main">
    <div class="visitor-letter-layout" id="letter-layout">
      <nav class="visitor-letter-sidebar" id="letter-sidebar" aria-label="편지 목차" hidden></nav>
      <article class="visitor-letter-paper" aria-labelledby="letter-title">
        <div class="visitor-letter-top">
          <span class="visitor-letter-issue" id="letter-issue"></span>
          <a class="visitor-letter-close" href="../index.html" aria-label="편지 닫고 홈으로 이동">닫기</a>
        </div>
        <h1 id="letter-title">다로리 편지</h1>
        <p class="visitor-letter-intro" id="letter-intro"></p>
        <p class="visitor-letter-unavailable" id="letter-unavailable" role="status">편지를 불러오는 중입니다.</p>
        <div id="letter-sections"></div>
        <section class="visitor-letter-quiz" aria-labelledby="letter-quiz-heading" id="letter-quiz" hidden>
          <h2 id="letter-quiz-heading">🎁 다로리 퀴즈</h2>
          <fieldset></fieldset>
          <button type="button" disabled title="퀴즈 결과 확인 기능 연결 준비 중">퀴즈 제출</button>
        </section>
      </article>
    </div>
    <noscript><p class="visitor-letter-example">편지 내용을 표시하려면 JavaScript를 활성화해 주세요.</p></noscript>
  </main>
  <div data-visitor-footer></div>
</body>
</html>
