<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공지사항 | From. 다로리</title>
  <link rel="icon" type="image/svg+xml" href="../images/visitor/darori-envelope-logo.svg">
  <link rel="stylesheet" href="../css/site-header.css">
  <link rel="stylesheet" href="../css/visitor/visitor-common.css">
  <link rel="stylesheet" href="../css/visitor/visitor-notices.css">
  <script defer src="../js/visitor/visitor-common.js"></script>
  <script defer src="../js/visitor/visitor-notices.js"></script>
</head>
<body class="visitor-page" data-visitor-page="notices">
  <div data-visitor-header></div>
  <main class="visitor-container visitor-notices">
    <h1>공지사항</h1>
    <p class="visitor-notices-intro">다로리의 새로운 소식과 안내를 전해 드립니다.</p>
    <div class="visitor-notices-toolbar">
      <div class="visitor-notices-filters" role="group" aria-label="공지 분류">
        <button type="button" data-category="" aria-pressed="true">전체</button>
        <button type="button" data-category="GUIDE" aria-pressed="false">안내</button>
        <button type="button" data-category="NEWS" aria-pressed="false">소식</button>
        <button type="button" data-category="PROGRAM" aria-pressed="false">프로그램</button>
        <button type="button" data-category="CLOSED" aria-pressed="false">마감</button>
      </div>
      <form class="visitor-notices-search" role="search" aria-label="공지사항 검색">
        <input type="search" name="query" aria-label="공지 제목" placeholder="검색어를 입력하세요.">
        <button type="submit">검색</button>
      </form>
    </div>
    <p class="visitor-notices-status" role="status"></p>
    <ul class="visitor-notices-list" aria-label="공지사항 목록"></ul>
  </main>
  <div data-visitor-footer></div>
</body>
</html>
