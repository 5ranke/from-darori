<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지난 편지 | From. 다로리</title>
  <link rel="icon" type="image/svg+xml" href="../images/visitor/darori-envelope-logo.svg">
  <link rel="stylesheet" href="../css/site-header.css">
  <link rel="stylesheet" href="../css/visitor/visitor-common.css">
  <link rel="stylesheet" href="../css/visitor/visitor-letters.css">
  <link rel="stylesheet" href="../css/visitor/visitor-story-dialog.css">
  <script defer src="../js/visitor/visitor-common.js"></script>
  <script defer src="../js/visitor/visitor-letters.js"></script>
</head>
<body class="visitor-page" data-visitor-page="letters">
  <div data-visitor-header></div>

  <main class="visitor-container vl-main">
    <h1 class="vl-title">지난 편지</h1>
    <p class="vl-desc">발행된 모든 뉴스레터를 최신순으로 모았습니다.</p>

    <!-- 탭 + 연도 선택 -->
    <div class="vl-toolbar">
      <div class="vl-tabs" id="vl-tabs" role="group" aria-label="편지 분류"></div>
      <select id="vl-year" class="vl-year" aria-label="발행 연도" hidden></select>
    </div>

    <p class="vl-status" id="vl-status" role="status">불러오는 중이에요…</p>
    <div class="vl-grid" id="vl-grid"></div>

    <!-- 더 보기 / 접기 -->
    <button type="button" class="vl-more" id="vl-more" aria-label="더 보기" hidden>
      <svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M3 6l5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </button>
  </main>

  <!-- 자세히 보기 팝업 -->
  <dialog class="visitor-story-dialog" id="vl-dialog" aria-labelledby="vl-d-title">
    <div class="visitor-story-top">
      <div class="visitor-story-meta">
        <span class="visitor-story-tag" id="vl-d-badge"></span>
        <span class="visitor-story-date" id="vl-d-issue"></span>
      </div>
      <button class="visitor-story-close" type="button" id="vl-d-close" autofocus>닫기</button>
    </div>
    <h2 class="visitor-story-title" id="vl-d-title"></h2>
    <div class="visitor-story-body" id="vl-d-body"></div>
    <div class="visitor-story-images" id="vl-d-images" role="region" aria-label="소식 사진" tabindex="0" hidden></div>
    <p class="visitor-story-extra" id="vl-d-deadline" hidden></p>
    <a class="visitor-story-extra" id="vl-d-action" target="_blank" rel="noopener noreferrer" hidden>관련 링크 보기</a>
    <a class="visitor-story-letter" id="vl-d-go"><span id="vl-d-go-label"></span> <span aria-hidden="true">↗</span></a>
  </dialog>

  <div data-visitor-footer></div>
</body>
</html>
