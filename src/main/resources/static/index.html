<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="다녀가신 뒤에도 다로리 소식을 전해드려요. From. 다로리에서 마을의 안부를 만나보세요.">
  <title>From. 다로리</title>
  <link rel="stylesheet" href="css/visitor/visitor-common.css">
  <link rel="stylesheet" href="css/visitor/visitor-home.css">
  <script>
    window.DaroriVisitorConfig = { page: 'home', routes: { home: '/', subscribe: '#subscription' } };
  </script>
  <script defer src="js/visitor/visitor-common.js"></script>
  <script defer src="js/visitor/visitor-home.js"></script>
</head>
<body class="visitor-page visitor-home" data-visitor-page="home">
  <div data-visitor-header></div>
  <main class="visitor-container visitor-home-main">
    <section class="visitor-home-hero" aria-labelledby="home-heading">
      <h1 id="home-heading">다녀가신 뒤에도<br>다로리 소식을 전해드려요</h1>
      <p>참여하셨던 프로젝트가 지금 어떻게 진행되고 있는지, 마을에서 새로<br class="visitor-home-desktop-break"> 찾는 사람은 누구인지 한 달에 한 번 소식을 보내드립니다.</p>
      <a class="visitor-home-button" id="home-latest-letter" hidden>최신 편지 읽기 <span aria-hidden="true">↗</span></a>
    </section>

    <p id="home-content-status" role="status"></p>

    <section class="visitor-home-section visitor-home-news" aria-labelledby="home-news-heading" hidden>
      <h2 id="home-news-heading">다로리 소식</h2>
      <div class="visitor-home-news-grid" id="home-news-grid"></div>
    </section>

    <section class="visitor-home-section visitor-home-letters" aria-labelledby="home-letters-heading" hidden>
      <div class="visitor-home-section-heading">
        <h2 id="home-letters-heading">지난 편지</h2>
        <a class="visitor-home-all" href="visitor/letters.html" style="text-decoration: none;">전체 보기 &gt;</a>
      </div>
      <div class="visitor-home-letter-list" id="home-letter-list"></div>
    </section>

    <template id="home-news-template">
      <article class="visitor-home-news-card">
        <span class="visitor-home-tag"></span>
        <p class="visitor-home-date"></p>
        <h3></h3>
        <p class="visitor-home-excerpt"></p>
        <button class="visitor-home-button" type="button" aria-haspopup="dialog" aria-controls="home-story-dialog">자세히 보기 <span aria-hidden="true">↗</span></button>
      </article>
    </template>

    <template id="home-letter-template">
      <article class="visitor-home-letter">
        <img class="visitor-home-thumbnail" alt="" width="162" height="162" loading="lazy">
        <div class="visitor-home-letter-copy">
          <span class="visitor-home-tag"></span>
          <h3></h3>
          <p></p>
        </div>
        <a class="visitor-home-button">편지 읽기 <span aria-hidden="true">↗</span></a>
      </article>
    </template>

    <section class="visitor-home-subscription" id="subscription" aria-labelledby="home-subscription-heading">
      <div class="visitor-home-subscription-copy">
        <p>다로리 소식이 더 궁금하다면,</p>
        <h2 id="home-subscription-heading"><span>다로리 편지</span>를 받아보세요</h2>
      </div>
      <!-- API 미연결: 전송 가능한 form으로 만들지 않으며 이메일을 저장·전송하지 않습니다. -->
      <div class="visitor-home-subscription-fields">
        <div class="visitor-home-subscription-row">
          <label class="visitor-home-sr-only" for="home-subscription-email">이메일 주소</label>
          <input id="home-subscription-email" name="email" type="email" maxlength="254" required aria-describedby="home-subscription-feedback" autocomplete="email" placeholder="이메일 주소를 입력하세요.">
          <button class="visitor-home-button" id="home-subscription-button" type="button" disabled title="구독 신청 API 연결 준비 중">편지 받기</button>
        </div>
        <label class="visitor-home-consent" for="home-subscription-consent">
          <input id="home-subscription-consent" type="checkbox" name="agreedToPrivacy" required aria-describedby="home-subscription-feedback">
          <span>(필수) 개인정보 수집 및 이용에 동의합니다.</span>
        </label>
        <p class="visitor-home-subscription-feedback" id="home-subscription-feedback" role="status" aria-live="polite">구독 신청 기능 준비 중입니다. 입력한 정보는 전송·저장되지 않습니다.</p>
      </div>
    </section>
  </main>
  <div data-visitor-footer></div>
  <dialog class="visitor-home-story-dialog" id="home-story-dialog" aria-labelledby="home-story-title">
    <div class="visitor-home-story-top">
      <div class="visitor-home-story-meta">
        <span class="visitor-home-tag" id="home-story-category"></span>
        <span class="visitor-home-story-date" id="home-story-date"></span>
      </div>
      <button class="visitor-home-story-close" type="button" id="home-story-close" autofocus>닫기</button>
    </div>
    <h2 class="visitor-home-story-title" id="home-story-title"></h2>
    <div class="visitor-home-story-body" id="home-story-body"></div>
    <div class="visitor-home-story-images" id="home-story-images" role="region" aria-label="소식 사진" tabindex="0" hidden></div>
    <p class="visitor-home-story-extra" id="home-story-deadline" hidden></p>
    <a class="visitor-home-story-extra" id="home-story-action" hidden>관련 링크 보기</a>
    <a class="visitor-home-button visitor-home-story-letter" id="home-story-letter"><span id="home-story-letter-label"></span> <span aria-hidden="true">↗</span></a>
  </dialog>
</body>
</html>
