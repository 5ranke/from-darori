<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>{{TITLE}}</title>
<style>
@media only screen and (max-width: 480px) {
  .mail-paper { padding: 22px 18px !important; }
  .mail-title { font-size: 26px !important; }
}
</style>
</head>
<body style="margin:0;padding:0;background:#ffffff;color:#292929;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;">
<tr><td align="center">
<!--[if mso]><table role="presentation" width="640" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:640px;margin:0 auto;table-layout:fixed;">
<tr><td class="mail-paper" style="padding:32px;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.85;overflow-wrap:anywhere;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-bottom:1px solid #ff6547;">
<tr><td style="padding:0 0 20px;">
<table role="presentation" cellpadding="0" cellspacing="0" border="0">
<tr><td style="padding-right:8px;"><img src="{{LOGO}}" width="40" height="30" alt="" style="display:block;border:0;"></td>
<td style="font-size:21px;line-height:1.3;font-weight:700;letter-spacing:-.6px;">From. 다로리</td></tr>
</table>
<div style="padding-top:5px;font-size:12px;color:#62626c;">마을에서 보내는 한 달의 안부</div>
</td><td align="right" style="padding:0 0 20px 8px;font-size:12px;color:#62626c;">{{ISSUE}}</td></tr>
</table>
<p style="margin:24px 0 4px;color:#62626c;font-size:12px;">다녀가신 뒤에도, 이어지는 마을 이야기</p>
<h1 class="mail-title" style="margin:0 0 14px;font-size:30px;line-height:1.4;letter-spacing:-1px;word-break:keep-all;overflow-wrap:anywhere;">{{HEADING}}</h1>
{{INTRO}}
{{SUMMARY}}
{{STORIES}}
{{QUIZ}}
{{CLOSING}}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:32px;">
<tr><td style="padding:24px;background:#f5f5f5;border-radius:10px;">
<strong style="font-size:17px;">다로리 마을에서 지역으로,<br>다같이 다로리</strong>
<p style="margin:8px 0 12px;font-size:13px;color:#62626c;">마을의 일상과 함께하는 사람들의 이야기를 전합니다.</p>
<div style="font-size:13px;">{{TEAM_LINKS}}</div>
</td></tr></table>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:26px;border-top:1px solid #ededed;">
<tr><td align="center" style="padding-top:20px;font-size:12px;color:#62626c;">
<strong style="color:#292929;">From. 다로리</strong><br>구독을 신청한 이메일 주소로 보내드리는 편지입니다.<br>{{FOOTER_LINKS}}
</td></tr></table>
</td></tr></table>
<!--[if mso]></td></tr></table><![endif]-->
</td></tr></table>
</body>
</html>
